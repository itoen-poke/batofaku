<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バトルファクトリー ポケモン検索 p</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2028;
    --panel2: #20242d;
    --border: #2b3038;
    --accent: #5b9dff;
    --accent2: #ff9f5b;
    --text: #e8eaed;
    --sub: #9aa3ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 24px;
    transition: padding-bottom 0.15s;
  }
  body.has-compare {
    padding-bottom: 210px;
  }
  .topbar {
    max-width: 640px;
    margin: 0 auto 4px;
    display: flex;
    justify-content: flex-end;
  }
  #typeChartBtn {
    font-size: 0.75rem;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  #typeChartBtn:active {
    background: #262b34;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .sub {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  #searchWrap {
    max-width: 640px;
    margin: 0 auto 20px;
    position: relative;
  }
  #searchInput {
    width: 100%;
    padding: 14px 40px 14px 16px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #searchInput:focus {
    border-color: var(--accent);
  }
  #clearBtn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--border);
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #clearBtn:active {
    background: #3a4049;
  }
  #clearBtn.show {
    display: flex;
  }
  #count {
    max-width: 640px;
    margin: 0 auto 12px;
    color: var(--sub);
    font-size: 0.8rem;
    text-align: right;
  }
  #results {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card.selected {
    border-color: var(--accent);
  }
  .card-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 16px 0;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .cycle {
    font-size: 0.7rem;
    color: var(--bg);
    background: var(--accent);
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: bold;
  }
  .name {
    font-size: 1.05rem;
    font-weight: bold;
  }
  .meta {
    color: var(--sub);
    font-size: 0.8rem;
  }
  .clickable {
    cursor: pointer;
  }
  .clickable:active {
    background: #232833;
  }
  .chevron {
    margin-left: auto;
    color: var(--sub);
    font-size: 0.75rem;
    align-self: center;
    transition: transform 0.15s;
    user-select: none;
  }
  .card.open .chevron {
    transform: rotate(180deg);
  }
  .card-actions {
    display: flex;
    padding: 8px 16px 0;
  }
  .compare-btn {
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--sub);
    cursor: pointer;
  }
  .compare-btn.active-1 {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(91,157,255,0.12);
  }
  .compare-btn.active-2 {
    border-color: var(--accent2);
    color: var(--accent2);
    background: rgba(255,159,91,0.12);
  }
  .compare-btn.disabled {
    opacity: 0.4;
  }
  .moves {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px 12px;
  }
  .move {
    background: #262b34;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.82rem;
  }
  .move.hit {
    background: rgba(91,157,255,0.18);
    border-color: var(--accent);
    color: #bcd8ff;
  }
  .name.hit {
    color: var(--accent);
  }
  .stats-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
    background: var(--panel2);
    border-top: 1px solid var(--border);
  }
  .card.open .stats-panel {
    max-height: 260px;
  }
  .stats-inner {
    padding: 12px 16px 14px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 34px 1fr 34px;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    margin-bottom: 5px;
  }
  .stat-label {
    color: var(--sub);
    font-weight: bold;
  }
  .stat-bar-bg {
    background: #12151a;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4f8cff, #7bb3ff);
  }
  .stat-value {
    text-align: right;
    color: var(--text);
  }
  .stat-total {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .stat-total b {
    color: var(--text);
  }
  .no-stats {
    color: var(--sub);
    font-size: 0.8rem;
    padding: 4px 0;
  }
  #empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
    display: none;
  }

  /* compare bar */
  #compareBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    justify-content: center;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 50;
  }
  #compareBar.show {
    display: flex;
  }
  .compare-inner {
    width: 100%;
    max-width: 640px;
    background: #1a1e25;
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.4);
    pointer-events: auto;
    overflow: hidden;
  }
  .compare-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
  }
  .compare-title {
    font-size: 0.72rem;
    color: var(--sub);
  }
  .compare-clear {
    font-size: 0.72rem;
    color: var(--sub);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .compare-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .compare-col {
    padding: 10px 10px 12px;
    max-height: 180px;
    overflow-y: auto;
  }
  .compare-col:first-child {
    border-right: 1px solid var(--border);
  }
  .compare-col-empty {
    color: var(--sub);
    font-size: 0.75rem;
    text-align: center;
    padding: 20px 0;
  }
  .compare-head-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .compare-slot-badge {
    font-size: 0.65rem;
    font-weight: bold;
    padding: 0 6px;
    border-radius: 10px;
    color: var(--bg);
  }
  .compare-slot-badge.slot1 { background: var(--accent); }
  .compare-slot-badge.slot2 { background: var(--accent2); }
  .compare-name {
    font-size: 0.9rem;
    font-weight: bold;
    flex: 1;
  }
  .compare-remove {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0 2px;
  }
  .compare-meta {
    font-size: 0.68rem;
    color: var(--sub);
    margin-bottom: 6px;
  }
  .compare-moves {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .compare-move {
    font-size: 0.65rem;
    background: #262b34;
    border-radius: 5px;
    padding: 2px 6px;
  }
  .compare-stat-row {
    display: grid;
    grid-template-columns: 20px 1fr 26px;
    align-items: center;
    gap: 5px;
    font-size: 0.68rem;
    margin-bottom: 3px;
  }
  .compare-stat-label {
    color: var(--sub);
    font-weight: bold;
  }
  .compare-stat-bar-bg {
    background: #12151a;
    border-radius: 3px;
    height: 6px;
    overflow: hidden;
  }
  .compare-stat-bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .compare-col:first-child .compare-stat-bar-fill { background: var(--accent); }
  .compare-col:last-child .compare-stat-bar-fill { background: var(--accent2); }
  .compare-stat-value {
    text-align: right;
  }
  .compare-stat-value.win {
    color: #7CFC9A;
    font-weight: bold;
  }

  /* type chart modal */
  #typeModalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  #typeModalOverlay.show {
    display: flex;
  }
  #typeModal {
    background: #1a1e25;
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 100%;
    width: 100%;
    max-width: 620px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .type-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .type-modal-head h2 {
    font-size: 0.95rem;
    margin: 0;
  }
  #typeModalClose {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: var(--border);
    color: var(--text);
    font-size: 1rem;
    cursor: pointer;
  }
  .type-modal-body {
    overflow: auto;
    padding: 10px;
  }
  .type-legend {
    font-size: 0.68rem;
    color: var(--sub);
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  table.type-table {
    border-collapse: collapse;
    font-size: 0.68rem;
    white-space: nowrap;
  }
  table.type-table th, table.type-table td {
    border: 1px solid var(--border);
    text-align: center;
    padding: 4px 5px;
    min-width: 26px;
  }
  table.type-table thead th {
    position: sticky;
    top: 0;
    background: #232833;
    z-index: 2;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: -2px;
    padding: 4px 2px;
  }
  table.type-table thead th.corner {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 3;
    writing-mode: horizontal-tb;
    letter-spacing: 0;
  }
  table.type-table tbody th {
    position: sticky;
    left: 0;
    background: #232833;
    z-index: 1;
    text-align: left;
  }
  table.type-table td.eff2 { color: #7CFC9A; font-weight: bold; }
  table.type-table td.eff05 { color: #ff9f5b; }
  table.type-table td.eff0 { color: #ff5b5b; font-weight: bold; }
</style>
</head>
<body>

<div class="topbar">
  <button id="typeChartBtn">📊 タイプ相性表</button>
</div>
<h1>バトルファクトリー ポケモン検索</h1>
<div class="sub">ポケモン名 または 技名 を入力 / タップで種族値表示</div>

<div id="searchWrap">
  <input type="text" id="searchInput" placeholder="例: ガブリアス / じしん" autofocus>
  <button id="clearBtn" title="クリア">✕</button>
</div>
<div id="count"></div>
<div id="results"></div>
<div id="empty">該当するデータが見つかりませんでした</div>

<div id="compareBar">
  <div class="compare-inner">
    <div class="compare-top">
      <span class="compare-title">種族値くらべる</span>
      <button class="compare-clear" id="compareClearAll">すべて解除</button>
    </div>
    <div class="compare-cols" id="compareCols"></div>
  </div>
</div>

<div id="typeModalOverlay">
  <div id="typeModal">
    <div class="type-modal-head">
      <h2>タイプ相性表（攻撃側 → 防御側）</h2>
      <button id="typeModalClose">✕</button>
    </div>
    <div class="type-legend">○=効果抜群(2倍)　△=いまひとつ(0.5倍)　×=効果なし(0倍)　空欄=等倍</div>
    <div class="type-modal-body" id="typeModalBody"></div>
  </div>
</div>

// compareSlots[0] / [1] hold pokemon data objects (from DATA) or null
let compareSlots = [null, null];

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

/* ---------- stats / search list ---------- */

function statsPanelHtml(name) {
  const s = STATS[name];
  if (!s) {
    return '<div class="stats-inner"><div class="no-stats">種族値データが見つかりませんでした</div></div>';
  }
  const total = s.reduce((a,b) => a+b, 0);
  const rows = s.map((v, i) => `
    <div class="stat-row">
      <span class="stat-label">${STAT_LABELS[i]}</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${Math.min(100, v/STAT_MAX*100)}%"></div></div>
      <span class="stat-value">${v}</span>
    </div>
  `).join('');
  return `<div class="stats-inner">${rows}<div class="stat-total"><span>合計</span><b>${total}</b></div></div>`;
}

function slotIndexOf(id) {
  return compareSlots.findIndex(p => p && p.id === id);
}

function toggleCompare(p) {
  const existing = slotIndexOf(p.id);
  if (existing !== -1) {
    compareSlots[existing] = null;
  } else {
    const emptySlot = compareSlots.findIndex(s => s === null);
    if (emptySlot === -1) return; // both full, ignore
    compareSlots[emptySlot] = p;
  }
  renderCompareBar();
  renderResultCompareButtons();
}

function renderResultCompareButtons() {
  document.querySelectorAll('.compare-btn').forEach(btn => {
    const id = Number(btn.dataset.id);
    const slot = slotIndexOf(id);
    btn.classList.remove('active-1', 'active-2', 'disabled');
    if (slot === 0) {
      btn.textContent = '☑ 比較する 1/2';
      btn.classList.add('active-1');
    } else if (slot === 1) {
      btn.textContent = '☑ 比較する 2/2';
      btn.classList.add('active-2');
    } else {
      btn.textContent = '＋ 比較に追加';
      if (compareSlots[0] && compareSlots[1]) btn.classList.add('disabled');
    }
    const card = btn.closest('.card');
    if (card) card.classList.toggle('selected', slot !== -1);
  });
}

function compareColHtml(p, slotNum) {
  if (!p) {
    return `<div class="compare-col-empty">比較する${slotNum}/2<br>を選択してください</div>`;
  }
  const s = STATS[p.name];
  const other = compareSlots[slotNum === 1 ? 1 : 0];
  const otherS = other ? STATS[other.name] : null;
  let statsHtml = '<div class="no-stats" style="font-size:0.68rem;">データなし</div>';
  if (s) {
    statsHtml = s.map((v, i) => {
      const ov = otherS ? otherS[i] : null;
      const win = ov !== null && v > ov;
      return `
        <div class="compare-stat-row">
          <span class="compare-stat-label">${STAT_LABELS[i]}</span>
          <div class="compare-stat-bar-bg"><div class="compare-stat-bar-fill" style="width:${Math.min(100, v/STAT_MAX*100)}%"></div></div>
          <span class="compare-stat-value${win ? ' win' : ''}">${v}</span>
        </div>
      `;
    }).join('');
  }
  return `
    <div class="compare-head-row">
      <span class="compare-slot-badge slot${slotNum}">${slotNum}</span>
      <span class="compare-name">${escapeHtml(p.name)}</span>
      <button class="compare-remove" data-slot="${slotNum - 1}">✕</button>
    </div>
    <div class="compare-meta">${p.cycle}周 / ${escapeHtml(p.nature)} / ${escapeHtml(p.evs)} / ${escapeHtml(p.item)}</div>
    <div class="compare-moves">${p.moves.map(m => `<span class="compare-move">${escapeHtml(m || '')}</span>`).join('')}</div>
    ${statsHtml}
  `;
}

function renderCompareBar() {
  const anySelected = compareSlots[0] || compareSlots[1];
  compareBar.classList.toggle('show', !!anySelected);
  document.body.classList.toggle('has-compare', !!anySelected);
  if (!anySelected) {
    compareCols.innerHTML = '';
    return;
  }
  compareCols.innerHTML =
    `<div class="compare-col">${compareColHtml(compareSlots[0], 1)}</div>` +
    `<div class="compare-col">${compareColHtml(compareSlots[1], 2)}</div>`;
  compareCols.querySelectorAll('.compare-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = Number(btn.dataset.slot);
      compareSlots[slot] = null;
      renderCompareBar();
      renderResultCompareButtons();
    });
  });
}

compareClearAll.addEventListener('click', () => {
  compareSlots = [null, null];
  renderCompareBar();
  renderResultCompareButtons();
});

function render(query) {
  const q = query.trim();
  results.innerHTML = '';

  clearBtn.classList.toggle('show', q.length > 0);

  if (!q) {
    countEl.textContent = '';
    emptyEl.style.display = 'none';
    return;
  }

  const matched = DATA.filter(p => {
    if (p.name.includes(q)) return true;
    return p.moves.some(m => m && m.includes(q));
  });

  countEl.textContent = matched.length + ' 件';

  if (matched.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const frag = document.createDocumentFragment();
  matched.slice(0, 300).forEach((p) => {
    const nameHit = p.name.includes(q);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head clickable">
        <span class="cycle">${p.cycle}周</span>
        <span class="name${nameHit ? ' hit' : ''}">${escapeHtml(p.name)}</span>
        <span class="meta">${escapeHtml(p.nature)} / ${escapeHtml(p.evs)} / ${escapeHtml(p.item)}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-actions">
        <button class="compare-btn" data-id="${p.id}">＋ 比較に追加</button>
      </div>
      <div class="moves">
        ${p.moves.map(m => `<span class="move${m && m.includes(q) ? ' hit' : ''}">${escapeHtml(m || '')}</span>`).join('')}
      </div>
      <div class="stats-panel">${statsPanelHtml(p.name)}</div>
    `;
    const head = card.querySelector('.card-head');
    head.addEventListener('click', () => {
      card.classList.toggle('open');
    });
    const cbtn = card.querySelector('.compare-btn');
    cbtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCompare(p);
    });
    frag.appendChild(card);
  });
  results.appendChild(frag);
  renderResultCompareButtons();
}

input.addEventListener('input', () => render(input.value));
clearBtn.addEventListener('click', () => {
  input.value = '';
  input.focus();
  render('');
});

render('');

/* ---------- type chart modal ---------- */

function buildTypeTable() {
  const types = TYPE_DATA.types;
  const eff = TYPE_DATA.eff;
  let html = '<table class="type-table"><thead><tr><th class="corner">攻\\防</th>';
  types.forEach(t => { html += `<th>${t}</th>`; });
  html += '</tr></thead><tbody>';
  types.forEach(atk => {
    html += `<tr><th>${atk}</th>`;
    types.forEach(def => {
      const v = (eff[atk] && eff[atk][def] !== undefined) ? eff[atk][def] : 1;
      let cls = '', sym = '';
      if (v === 2) { cls = 'eff2'; sym = '○'; }
      else if (v === 0.5) { cls = 'eff05'; sym = '△'; }
      else if (v === 0) { cls = 'eff0'; sym = '×'; }
      html += `<td class="${cls}">${sym}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

typeModalBody.innerHTML = buildTypeTable();

typeChartBtn.addEventListener('click', () => {
  typeModalOverlay.classList.add('show');
});
typeModalClose.addEventListener('click', () => {
  typeModalOverlay.classList.remove('show');
});
typeModalOverlay.addEventListener('click', (e) => {
  if (e.target === typeModalOverlay) typeModalOverlay.classList.remove('show');
});
</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バトルファクトリー ポケモン検索</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2028;
    --panel2: #20242d;
    --border: #2b3038;
    --accent: #5b9dff;
    --text: #e8eaed;
    --sub: #9aa3ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .sub {
    text-align: center;
    color: var(--sub);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  #searchWrap {
    max-width: 640px;
    margin: 0 auto 20px;
    position: relative;
  }
  #searchInput {
    width: 100%;
    padding: 14px 16px;
    font-size: 1.05rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
  }
  #searchInput:focus {
    border-color: var(--accent);
  }
  #count {
    max-width: 640px;
    margin: 0 auto 12px;
    color: var(--sub);
    font-size: 0.8rem;
    text-align: right;
  }
  #results {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-head {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 12px 16px 0;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .cycle {
    font-size: 0.7rem;
    color: var(--bg);
    background: var(--accent);
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: bold;
  }
  .name {
    font-size: 1.05rem;
    font-weight: bold;
  }
  .meta {
    color: var(--sub);
    font-size: 0.8rem;
  }
  .moves {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 16px 12px;
  }
  .move {
    background: #262b34;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.82rem;
  }
  .move.hit {
    background: rgba(91,157,255,0.18);
    border-color: var(--accent);
    color: #bcd8ff;
  }
  .name.hit {
    color: var(--accent);
  }
  .clickable {
    cursor: pointer;
  }
  .clickable:active {
    background: #232833;
  }
  .chevron {
    margin-left: auto;
    color: var(--sub);
    font-size: 0.75rem;
    padding-right: 16px;
    align-self: center;
    transition: transform 0.15s;
    user-select: none;
  }
  .card.open .chevron {
    transform: rotate(180deg);
  }
  .stats-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
    background: var(--panel2);
    border-top: 1px solid var(--border);
  }
  .card.open .stats-panel {
    max-height: 260px;
  }
  .stats-inner {
    padding: 12px 16px 14px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 34px 1fr 34px;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    margin-bottom: 5px;
  }
  .stat-label {
    color: var(--sub);
    font-weight: bold;
  }
  .stat-bar-bg {
    background: #12151a;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4f8cff, #7bb3ff);
  }
  .stat-value {
    text-align: right;
    color: var(--text);
  }
  .stat-total {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .stat-total b {
    color: var(--text);
  }
  .no-stats {
    color: var(--sub);
    font-size: 0.8rem;
    padding: 4px 0;
  }
  #empty {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
    display: none;
  }
</style>
</head>
<body>

<div class="sub">ポケモン名 または 技名 を入力 / タップで種族値表示</div>

const STAT_LABELS = ['H','A','B','C','D','S'];
const STAT_MAX = 255;

const input = document.getElementById('searchInput');
const results = document.getElementById('results');
const countEl = document.getElementById('count');
const emptyEl = document.getElementById('empty');

function escapeHtml(s) {
  return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

function statsPanelHtml(name) {
  const s = STATS[name];
  if (!s) {
    return '<div class="stats-inner"><div class="no-stats">種族値データが見つかりませんでした</div></div>';
  }
  const total = s.reduce((a,b) => a+b, 0);
  const rows = s.map((v, i) => `
    <div class="stat-row">
      <span class="stat-label">${STAT_LABELS[i]}</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${Math.min(100, v/STAT_MAX*100)}%"></div></div>
      <span class="stat-value">${v}</span>
    </div>
  `).join('');
  return `<div class="stats-inner">${rows}<div class="stat-total"><span>合計</span><b>${total}</b></div></div>`;
}

function render(query) {
  const q = query.trim();
  results.innerHTML = '';

  if (!q) {
    countEl.textContent = '';
    emptyEl.style.display = 'none';
    return;
  }

  const matched = DATA.filter(p => {
    if (p.name.includes(q)) return true;
    return p.moves.some(m => m && m.includes(q));
  });

  countEl.textContent = matched.length + ' 件';

  if (matched.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const frag = document.createDocumentFragment();
  matched.slice(0, 300).forEach((p, idx) => {
    const nameHit = p.name.includes(q);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head clickable">
        <span class="cycle">${p.cycle}周</span>
        <span class="name${nameHit ? ' hit' : ''}">${escapeHtml(p.name)}</span>
        <span class="meta">${escapeHtml(p.nature)} / ${escapeHtml(p.evs)} / ${escapeHtml(p.item)}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="moves">
        ${p.moves.map(m => `<span class="move${m && m.includes(q) ? ' hit' : ''}">${escapeHtml(m || '')}</span>`).join('')}
      </div>
      <div class="stats-panel">${statsPanelHtml(p.name)}</div>
    `;
    const head = card.querySelector('.card-head');
    head.addEventListener('click', () => {
      card.classList.toggle('open');
    });
    frag.appendChild(card);
  });
  results.appendChild(frag);
}

input.addEventListener('input', () => render(input.value));
render('');

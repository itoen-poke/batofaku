<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バトルファクトリー ポケモン検索</title>
<style>
  :root {
    --bg: #eef6ff;
    --panel: rgba(255,255,255,0.86);
    --panel2: rgba(255,255,255,0.7);
    --border: rgba(40,60,90,0.14);
    --accent: #3b82d6;
    --accent2: #ff9f5b;
    --text: #263447;
    --sub: #5c6b80;
    --shadow: 0 2px 10px rgba(30,50,90,0.1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
  }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: transparent;
    color: var(--text);
    padding: 24px 16px 24px;
    transition: padding-bottom 0.15s;
  }
  body.has-compare {
    padding-bottom: 210px;
  }

  /* ---------- pattern background ---------- */
  #bgScene {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    transition: opacity 1.4s ease;
  }
  #bgScene svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .topbar {
    max-width: 640px;
    margin: 0 auto 4px;
    display: flex;
    justify-content: flex-end;
  }
  #typeChartBtn {
    font-size: 0.75rem;
    padding: 7px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(6px);
    color: var(--text);
    cursor: pointer;
    box-shadow: var(--shadow);
    font-weight: 600;
  }
  #typeChartBtn:active {
    background: #fff;
  }
  h1 {
    text-align: center;
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
    color: #ffffff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.55);
    font-weight: 800;
  }
  .sub {
    text-align: center;
    color: #e8edf5;
    font-size: 0.85rem;
    margin-bottom: 20px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #searchWrap {
    max-width: 640px;
    margin: 0 auto 20px;
    position: relative;
  }
  #searchInput {
    width: 100%;
    padding: 14px 40px 14px 16px;
    font-size: 1.05rem;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel);
    backdrop-filter: blur(6px);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s;
    box-shadow: var(--shadow);
  }
  #searchInput::placeholder { color: #8a97a8; }
  #searchInput:focus {
    border-color: var(--accent);
  }
  #clearBtn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: #dde8f5;
    color: #45597a;
    font-size: 0.95rem;
    line-height: 1;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #clearBtn:active {
    background: #c9d8ec;
  }
  #clearBtn.show {
    display: flex;
  }
  #count {
    max-width: 640px;
    margin: 0 auto 12px;
    color: #e8edf5;
    font-size: 0.8rem;
    text-align: right;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #results {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card {
    background: var(--panel);
    backdrop-filter: blur(6px);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .card.selected {
    border-color: var(--accent);
  }
  .card-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px 0;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .cycle {
    font-size: 0.7rem;
    color: #fff;
    background: var(--accent);
    padding: 1px 7px;
    border-radius: 20px;
    font-weight: bold;
  }
  .name {
    font-size: 1.05rem;
    font-weight: bold;
    color: #1d3a5f;
  }
  .type-badges {
    display: flex;
    gap: 4px;
  }
  .type-badge {
    font-size: 0.62rem;
    font-weight: bold;
    color: #fff;
    padding: 2px 7px;
    border-radius: 4px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
    white-space: nowrap;
  }
  .meta {
    color: var(--sub);
    font-size: 0.8rem;
    width: 100%;
  }
  .clickable {
    cursor: pointer;
  }
  .clickable:active {
    background: rgba(59,130,214,0.08);
  }
  .chevron {
    margin-left: auto;
    color: var(--sub);
    font-size: 0.75rem;
    align-self: center;
    transition: transform 0.15s;
    user-select: none;
  }
  .card.open .chevron {
    transform: rotate(180deg);
  }
  .card-actions {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px 0;
    flex-wrap: wrap;
  }
  .compare-btn {
    font-size: 0.75rem;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--sub);
    cursor: pointer;
  }
  .compare-btn.active-1 {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(59,130,214,0.12);
  }
  .compare-btn.active-2 {
    border-color: var(--accent2);
    color: #c96a1f;
    background: rgba(255,159,91,0.16);
  }
  .compare-btn.disabled {
    opacity: 0.4;
  }
  .ability-label {
    font-size: 0.7rem;
    color: var(--sub);
  }
  .ability-chip {
    font-size: 0.72rem;
    padding: 4px 9px;
    border-radius: 20px;
    border: 1px solid #c9b8f0;
    background: #f1ebfc;
    color: #6a4fb0;
    cursor: pointer;
  }
  .ability-chip:active {
    background: #e3d7f7;
  }
  .moves {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 10px 16px 12px;
  }
  .move {
    background: #eef3f9;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 9px;
    font-size: 0.82rem;
    color: #35445a;
  }
  .move.hit {
    background: #dcebff;
    border-color: var(--accent);
    color: #1a5bab;
  }
  .name.hit {
    color: var(--accent);
  }
  .stats-panel {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.2s ease;
    background: rgba(240,246,253,0.9);
    border-top: 1px solid var(--border);
  }
  .card.open .stats-panel {
    max-height: 260px;
  }
  .stats-inner {
    padding: 12px 16px 14px;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 34px 1fr 34px;
    align-items: center;
    gap: 8px;
    font-size: 0.78rem;
    margin-bottom: 5px;
  }
  .stat-label {
    color: var(--sub);
    font-weight: bold;
  }
  .stat-bar-bg {
    background: #d8e3f0;
    border-radius: 4px;
    height: 8px;
    overflow: hidden;
  }
  .stat-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #4f8cff, #7bb3ff);
  }
  .stat-value {
    text-align: right;
    color: var(--text);
  }
  .stat-total {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--sub);
  }
  .stat-total b {
    color: var(--text);
  }
  .no-stats {
    color: var(--sub);
    font-size: 0.8rem;
    padding: 4px 0;
  }
  #empty {
    text-align: center;
    color: #e8edf5;
    padding: 40px 0;
    display: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  /* compare bar */
  #compareBar {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    display: none;
    justify-content: center;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    pointer-events: none;
    z-index: 50;
  }
  #compareBar.show {
    display: flex;
  }
  .compare-inner {
    width: 100%;
    max-width: 640px;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 -4px 24px rgba(30,50,90,0.18);
    pointer-events: auto;
    overflow: hidden;
  }
  .compare-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
  }
  .compare-title {
    font-size: 0.72rem;
    color: var(--sub);
  }
  .compare-clear {
    font-size: 0.72rem;
    color: var(--sub);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
  }
  .compare-cols {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .compare-col {
    padding: 10px 10px 12px;
    max-height: 180px;
    overflow-y: auto;
  }
  .compare-col:first-child {
    border-right: 1px solid var(--border);
  }
  .compare-col-empty {
    color: var(--sub);
    font-size: 0.75rem;
    text-align: center;
    padding: 20px 0;
  }
  .compare-head-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .compare-slot-badge {
    font-size: 0.65rem;
    font-weight: bold;
    padding: 0 6px;
    border-radius: 10px;
    color: #fff;
  }
  .compare-slot-badge.slot1 { background: var(--accent); }
  .compare-slot-badge.slot2 { background: var(--accent2); }
  .compare-name {
    font-size: 0.9rem;
    font-weight: bold;
    color: #1d3a5f;
  }
  .compare-remove {
    background: none;
    border: none;
    color: var(--sub);
    font-size: 0.9rem;
    cursor: pointer;
    padding: 0 2px;
    margin-left: auto;
  }
  .compare-type-badges {
    display: flex;
    gap: 3px;
  }
  .compare-type-badge {
    font-size: 0.58rem;
    font-weight: bold;
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
    text-shadow: 0 1px 1px rgba(0,0,0,0.25);
  }
  .compare-meta {
    font-size: 0.68rem;
    color: var(--sub);
    margin-bottom: 6px;
  }
  .compare-moves {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 8px;
  }
  .compare-move {
    font-size: 0.65rem;
    background: #eef3f9;
    border-radius: 5px;
    padding: 2px 6px;
    color: #35445a;
  }
  .compare-stat-row {
    display: grid;
    grid-template-columns: 20px 1fr 26px;
    align-items: center;
    gap: 5px;
    font-size: 0.68rem;
    margin-bottom: 3px;
  }
  .compare-stat-label {
    color: var(--sub);
    font-weight: bold;
  }
  .compare-stat-bar-bg {
    background: #d8e3f0;
    border-radius: 3px;
    height: 6px;
    overflow: hidden;
  }
  .compare-stat-bar-fill {
    height: 100%;
    border-radius: 3px;
  }
  .compare-col:first-child .compare-stat-bar-fill { background: var(--accent); }
  .compare-col:last-child .compare-stat-bar-fill { background: var(--accent2); }
  .compare-stat-value {
    text-align: right;
  }
  .compare-stat-value.win {
    color: #1f9c4e;
    font-weight: bold;
  }

  /* type chart modal */
  #typeModalOverlay, #abilityModalOverlay {
    position: fixed;
    inset: 0;
    background: rgba(20,30,45,0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  #typeModalOverlay.show, #abilityModalOverlay.show {
    display: flex;
  }
  #typeModal {
    background: rgba(255,255,255,0.98);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 100%;
    width: 100%;
    max-width: 620px;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .type-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .type-modal-head h2 {
    font-size: 0.95rem;
    margin: 0;
    color: #1d3a5f;
  }
  #typeModalClose, #abilityModalClose {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: #e5edf6;
    color: #35445a;
    font-size: 1rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .type-modal-body {
    overflow: auto;
    padding: 10px;
  }
  .type-legend {
    font-size: 0.68rem;
    color: var(--sub);
    padding: 0 14px 10px;
    flex-shrink: 0;
  }
  table.type-table {
    border-collapse: collapse;
    font-size: 0.68rem;
    white-space: nowrap;
  }
  table.type-table th, table.type-table td {
    border: 1px solid var(--border);
    text-align: center;
    padding: 4px 5px;
    min-width: 26px;
  }
  table.type-table thead th {
    position: sticky;
    top: 0;
    background: #e5edf6;
    z-index: 2;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: -2px;
    padding: 4px 2px;
    color: #1d3a5f;
  }
  table.type-table thead th.corner {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 3;
    writing-mode: horizontal-tb;
    letter-spacing: 0;
  }
  table.type-table tbody th {
    position: sticky;
    left: 0;
    background: #e5edf6;
    z-index: 1;
    text-align: left;
    color: #1d3a5f;
  }
  table.type-table td.eff2 { color: #1f9c4e; font-weight: bold; }
  table.type-table td.eff05 { color: #c96a1f; }
  table.type-table td.eff0 { color: #d1393f; font-weight: bold; }

  /* ability modal */
  #abilityModal {
    background: rgba(255,255,255,0.98);
    border: 1px solid #ddd0f5;
    border-radius: 14px;
    max-width: 360px;
    width: 100%;
    overflow: hidden;
  }
  .ability-modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .ability-modal-head h2 {
    font-size: 1rem;
    margin: 0;
    color: #6a4fb0;
  }
  .ability-modal-body {
    padding: 14px 16px 18px;
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
  }

/* HGSS move details — embedded data, no network requests. */
button.move, button.compare-move { font-family: inherit; cursor: pointer; line-height: 1.6; text-align: left; }
button.compare-move { border: 1px solid var(--border); }
button.move:hover, button.compare-move:hover { background: #dcebff; border-color: var(--accent); }
button.move:focus-visible, button.compare-move:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#moveModalOverlay { position: fixed; inset: 0; z-index: 150; background: rgba(20,30,45,.48); display: none; align-items: center; justify-content: center; padding: 16px; }
#moveModalOverlay.show { display: flex; }
#moveModal { width: 100%; max-width: 410px; max-height: 85vh; max-height: 85dvh; overflow: auto; overscroll-behavior: contain; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 12px 48px rgba(20,30,45,.25); }
.move-modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.move-modal-head h2 { margin: 0; font-size: 1.1rem; color: #1d3a5f; }
#moveModalClose { flex-shrink: 0; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #e5edf6; color: #35445a; font-size: 1.1rem; cursor: pointer; }
.move-modal-body { padding: 16px 18px 20px; font-size: .88rem; line-height: 1.7; }
.move-generation { color: var(--sub); font-size: .72rem; margin: 0 0 12px; }
.move-facts { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; margin: 0 0 16px; }
.move-facts > div { background: #f0f5fb; border-radius: 8px; padding: 8px 10px; }
.move-facts dt { color: var(--sub); font-size: .7rem; }
.move-facts dd { margin: 2px 0 0; color: #1d3a5f; font-size: .95rem; font-weight: 700; overflow-wrap: anywhere; }
.move-effect-title { margin: 0 0 5px; font-size: .8rem; color: var(--sub); }
#moveModalEffect { margin: 0; white-space: pre-line; }


/* Compact move dialog and one-tap cycle filter. */
#moveModal { max-width: 340px; border-radius: 12px; }
.move-modal-head { padding: 11px 14px; }
.move-modal-head h2 { font-size: 1rem; }
#moveModalClose { width: 32px; height: 32px; }
.move-modal-body { padding: 10px 14px 14px; font-size: .84rem; line-height: 1.65; }
.move-generation { margin-bottom: 8px; }
.move-facts { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 6px; margin-bottom: 12px; }
.move-facts > div { padding: 5px 8px; }
.move-facts dd { font-size: .85rem; margin-top: 1px; }
#cycleFilters { max-width: 640px; margin: -8px auto 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.cycle-filter { font: inherit; font-size: .78rem; min-height: 36px; padding: 5px 11px; border: 1px solid var(--border); border-radius: 18px; color: #35445a; background: rgba(255,255,255,.94); cursor: pointer; }
.cycle-filter[aria-pressed="true"] { background: #3b82d6; border-color: #3b82d6; color: #fff; font-weight: 700; }
.cycle-filter:focus-visible { outline: 3px solid #ff9f5b; outline-offset: 2px; }


/* One unobtrusive row: swipe horizontally on narrow screens. */
#cycleFilters { flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden; gap: 5px; padding: 2px 0 5px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
#cycleFilters::-webkit-scrollbar { display: none; }
.cycle-filter { flex: 0 0 auto; padding: 4px 10px; min-height: 32px; white-space: nowrap; }
#bgScene { pointer-events: none; background: #0d2a44; opacity: 1; }
#bgScene canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
h1 { font-size: clamp(1.05rem,4.5vw,1.4rem); color: #f9fcff; }
#visitorCounter { display: flex; align-items: center; justify-content: center; gap: 7px; max-width: 640px; margin: 14px auto 0; color: #324950; font-size: 10px; letter-spacing: .05em; }
#visitorCounter[hidden] { display: none; }
.visitor-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 8px; background: rgba(247,250,240,.88); border: 1px solid rgba(62,84,75,.18); border-radius: 4px; }
#visitorDigits { display: inline-flex; gap: 2px; }
#visitorDigits span { display: inline-block; min-width: 10px; padding: 1px 2px; background: #253e3c; border: 1px inset #789386; color: #cbeeb0; font: bold 12px/1.15 ui-monospace, 'Courier New', monospace; text-align: center; text-shadow: 0 0 3px rgba(197,245,150,.25); }
#busuanzi_value_page_pv { display: none; }


/* Shared site total and visit-only lucky-number message. */
#visitorCounter { flex-direction: column; gap: 5px; }
#kiribanMessage { margin: 0; padding: 4px 9px; color: #624414; background: #fff2c8; border: 1px solid #c9a54d; border-radius: 4px; font-size: 11px; font-weight: 700; }
#kiribanMessage[hidden] { display: none; }

</style>
</head>
<body>

<div id="bgScene"></div>

<div class="topbar">
  <button id="typeChartBtn">📊 タイプ相性表</button>
</div>
<h1>バトルファクトリー ポケモン検索</h1>
<div class="sub">名前・技で検索 / ポケモン名で種族値・技名で技詳細</div>

<div id="searchWrap">
  <input type="text" id="searchInput" placeholder="例: ガブリアス / じしん" autofocus>
  <button id="clearBtn" title="クリア">✕</button>
</div>
<div id="cycleFilters" role="group" aria-label="周回で絞り込み">
<button type="button" class="cycle-filter" data-cycle="0" aria-pressed="true">すべて</button>
<button type="button" class="cycle-filter" data-cycle="1" aria-pressed="false">1周</button>
<button type="button" class="cycle-filter" data-cycle="2" aria-pressed="false">2周</button>
<button type="button" class="cycle-filter" data-cycle="3" aria-pressed="false">3周</button>
<button type="button" class="cycle-filter" data-cycle="4" aria-pressed="false">4周</button>
<button type="button" class="cycle-filter" data-cycle="5" aria-pressed="false">5周</button>
<button type="button" class="cycle-filter" data-cycle="6" aria-pressed="false">6周</button>
<button type="button" class="cycle-filter" data-cycle="7" aria-pressed="false">7周</button>
</div>

const moveOverlay = document.getElementById('moveModalOverlay');
const moveDialog = document.getElementById('moveModal');
const moveClose = document.getElementById('moveModalClose');
let moveReturnFocus = null;
let movePreviousOverflow = '';
function moveButtonHtml(name, className) {
  if (!name) return '';
  return `<button type="button" class="${className}" data-move="${escapeHtml(name)}" aria-haspopup="dialog" aria-label="${escapeHtml(name)}の技詳細">${escapeHtml(name)}</button>`;
}
function openMoveModal(name, trigger) {
  const detail = MOVE_DETAILS[name];
  if (!detail) return;
  moveReturnFocus = trigger || document.activeElement;
  document.getElementById('moveModalName').textContent = name;
  const facts = [['タイプ', detail.type], ['分類', detail.category], ['威力', detail.power], ['命中', detail.accuracy], ['PP', detail.pp], ['優先度', detail.priority > 0 ? '+' + detail.priority : detail.priority]];
  document.getElementById('moveModalFacts').innerHTML = facts.map(([label,value]) => `<div><dt>${label}</dt><dd>${escapeHtml(String(value))}</dd></div>`).join('');
  document.getElementById('moveModalEffect').textContent = detail.effect;
  moveDialog.scrollTop = 0;
  movePreviousOverflow = document.body.style.overflow;
  document.body.style.overflow = 'hidden';
  moveOverlay.classList.add('show');
  moveClose.focus({preventScroll: true});
}
function closeMoveModal() {
  if (!moveOverlay.classList.contains('show')) return;
  moveOverlay.classList.remove('show');
  document.body.style.overflow = movePreviousOverflow;
  if (moveReturnFocus && moveReturnFocus.isConnected) moveReturnFocus.focus({preventScroll: true});
}
moveClose.addEventListener('click', closeMoveModal);
moveOverlay.addEventListener('click', e => { if (e.target === moveOverlay) closeMoveModal(); });
document.addEventListener('click', e => {
  const button = e.target.closest('button[data-move]');
  if (!button) return;
  e.stopPropagation();
  openMoveModal(button.dataset.move, button);
});
document.addEventListener('keydown', e => {
  if (!moveOverlay.classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeMoveModal(); }
  if (e.key === 'Tab') {
    const focusable = Array.from(moveDialog.querySelectorAll('button, summary, a[href]')).filter(el => el.getClientRects().length);
    const first = focusable[0], last = focusable[focusable.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === moveDialog)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

 'ORRRRRROOOORRRRRSO',
 'OOOOOOOWWWWOOOOOOO',
 'OWWWWWWOWWOWWWWWWO',
 'OWWWWWWOOOOOWWWWWO',
 'OWWWWWWWWWWWWWWWDO',
 '.OWWWWWWWWWWWWWDO.',
 '.OWWWWWWWWWWWWDDO.',
 '..OWWWWWWWWWWDDO..',
 '...OWWWWWWWDDDO...',
 '....OOWDDDDDOO....',
 '......OOOOOO......'
];
const PIXEL_SMALL_BALL=['....OOOO....','..OORRRROO..','.ORRHHRRRRO.','.ORRRRRRRRO.','ORRRROORRRSO','OOOOWWWOOOOO','OWWWOWWOWWWO','OWWWOOOOWWDO','.OWWWWWWWDO.','.OWWWWWWDDO.','..OOWDDDOO..','....OOOO....'];
const PIXEL_PAW = ['..XX...XX..','.XXXX.XXXX.','.XXXX.XXXX.','..XX...XX..','....XXX....','...XXXXX...','..XXXXXXX..','..XXXXXXX..','...XXXXX...'];
const PIXEL_GLYPHS = {
 flame:['.....X.....','....XXX....','....XXXX...','...XXXXX...','..XXXXXXX..','..XXXX.XX..','.XXXXX..XX.','.XXXX...XX.','.XXXXXXXXX.','..XXXXXXX..','...XXXXX...'],
 drop:['.....X.....','....XXX....','....XXX....','...XXXXX...','..XXXXXXX..','..XXXXXXX..','.XXXXXXXXX.','.XXXXXXXXX.','..XXXXXXX..','...XXXXX...'],
 leaf:['........XXX','.....XXXXXX','...XXXXXXXX','..XXXXXXXX.','.XXXXXXXX..','.XXXXXXX...','XXXXXXX....','XXXXXX.....','XXXX.......','XX.........'],
 spark:['.....XXXX..','....XXXX...','...XXXX....','..XXXX.....','.XXXXXXXXX.','....XXXX...','...XXXX....','..XXXX.....','..XXX......','.XX........']
};
let patternLastFrame=0;
let patternSlot=-1;
let patternPreviousTheme=PIXEL_PATTERN_THEMES[0];
let patternTransitionAt=0;
function patternBlendColor(from,to,amount){
 const a=parseInt(from.slice(1),16),b=parseInt(to.slice(1),16);
 return '#'+[16,8,0].map(shift=>Math.round(((a>>shift)&255)*(1-amount)+((b>>shift)&255)*amount).toString(16).padStart(2,'0')).join('');
}
function paintPixelSprite(sprite,x,y,colors,scale=1){
 sprite.forEach((row,sy)=>[...row].forEach((key,sx)=>{
  if(!colors[key])return;
  patternContext.fillStyle=colors[key];
  patternContext.fillRect(Math.round(x+sx*scale),Math.round(y+sy*scale),scale,scale);
 }));
}
function renderPixelPattern(now,dateMs=Date.now()){
 const nextSlot=Math.floor(dateMs/600000)%PIXEL_PATTERN_THEMES.length;
 if(nextSlot!==patternSlot){
  patternPreviousTheme=PIXEL_PATTERN_THEMES[patternSlot]||PIXEL_PATTERN_THEMES[nextSlot];
  patternSlot=nextSlot;patternTransitionAt=now;bgScene.dataset.scene=String(patternSlot);
 }
 const target=PIXEL_PATTERN_THEMES[patternSlot];
 const blend=patternMotionPreference.matches?1:Math.max(0,Math.min(1,(now-patternTransitionAt)/1400));
 const theme={bg:patternBlendColor(patternPreviousTheme.bg,target.bg,blend),accent:patternBlendColor(patternPreviousTheme.accent,target.accent,blend),shade:patternBlendColor(patternPreviousTheme.shade,target.shade,blend),glyph:target.glyph};
 const width=patternCanvas.width,height=patternCanvas.height;
 patternContext.fillStyle=theme.bg;patternContext.fillRect(0,0,width,height);
 const seconds=patternMotionPreference.matches?0:now/1000;
 const tile=96,drift=Math.floor(seconds*tile/55)%tile;
 const colors={O:'#20242c',R:theme.accent,S:theme.shade,H:'#ffe8df',W:'#f4f5ee',D:'#c2d0cc'};
 for(let row=-1;row<Math.ceil(height/tile)+1;row++){
  for(let col=-1;col<Math.ceil(width/tile)+1;col++){
   const x=col*tile+drift,y=row*tile+drift;
   const bob=patternMotionPreference.matches?0:Math.round(Math.sin(seconds*Math.PI/3+row+col));
   patternContext.globalAlpha=.88;
   paintPixelSprite(PIXEL_BALL,x+61,y+61+bob,colors);
   paintPixelSprite(PIXEL_SMALL_BALL,x+13,y+10-bob,colors);
   patternContext.globalAlpha=.56;
   paintPixelSprite(PIXEL_PAW,x+44,y+23,{X:theme.accent});
   paintPixelSprite(PIXEL_GLYPHS[theme.glyph],x+13,y+55,{X:theme.accent});
  }
 }
 patternContext.globalAlpha=1;
 // A stepped low-contrast vignette retains the original dark, readable backdrop.
 patternContext.fillStyle='#05070a';patternContext.globalAlpha=.07;
 patternContext.fillRect(0,height*.68,width,height*.32);
 patternContext.fillRect(0,height*.86,width,height*.14);
 patternContext.globalAlpha=1;
}
function resizePixelPattern(){
 const rect=bgScene.getBoundingClientRect();
 patternCanvas.width=Math.max(1,Math.round(rect.width/2));patternCanvas.height=Math.max(1,Math.round(rect.height/2));
 patternContext.imageSmoothingEnabled=false;renderPixelPattern(performance.now());
}
new ResizeObserver(resizePixelPattern).observe(bgScene);
resizePixelPattern();
function pixelPatternTick(now){
 if(!document.hidden&&now-patternLastFrame>125){renderPixelPattern(now);patternLastFrame=now;}
 requestAnimationFrame(pixelPatternTick);
}
requestAnimationFrame(pixelPatternTick);
/* ---------- end pixel pattern ---------- */


/* ---------- stats / search list ---------- */

function typeBadgesHtml(name, cls) {
  const types = POKE_TYPES[name];
  if (!types) return '';
  return `<span class="${cls}s">` + types.map(t =>
    `<span class="${cls}" style="background:${TYPE_COLORS[t] || '#888'}">${t}</span>`
  ).join('') + '</span>';
}

function abilityChipsHtml(name) {
  const abilities = POKE_ABILITIES[name];
  if (!abilities || !abilities.length) return '';
  const chips = abilities.map(a =>
    `<button class="ability-chip" data-ability="${escapeHtml(a)}">${escapeHtml(a)}</button>`
  ).join('');
  return `<span class="ability-label">とくせい:</span>${chips}`;
}

function statsPanelHtml(name) {
  const s = STATS[name];
  if (!s) {
    return '<div class="stats-inner"><div class="no-stats">種族値データが見つかりませんでした</div></div>';
  }
  const total = s.reduce((a,b) => a+b, 0);
  const rows = s.map((v, i) => `
    <div class="stat-row">
      <span class="stat-label">${STAT_LABELS[i]}</span>
      <div class="stat-bar-bg"><div class="stat-bar-fill" style="width:${Math.min(100, v/STAT_MAX*100)}%"></div></div>
      <span class="stat-value">${v}</span>
    </div>
  `).join('');
  return `<div class="stats-inner">${rows}<div class="stat-total"><span>合計</span><b>${total}</b></div></div>`;
}

function slotIndexOf(id) {
  return compareSlots.findIndex(p => p && p.id === id);
}

function toggleCompare(p) {
  const existing = slotIndexOf(p.id);
  if (existing !== -1) {
    compareSlots[existing] = null;
  } else {
    const emptySlot = compareSlots.findIndex(s => s === null);
    if (emptySlot === -1) return;
    compareSlots[emptySlot] = p;
  }
  renderCompareBar();
  renderResultCompareButtons();
}

function renderResultCompareButtons() {
  document.querySelectorAll('.compare-btn').forEach(btn => {
    const id = Number(btn.dataset.id);
    const slot = slotIndexOf(id);
    btn.classList.remove('active-1', 'active-2', 'disabled');
    if (slot === 0) {
      btn.textContent = '☑ 比較する 1/2';
      btn.classList.add('active-1');
    } else if (slot === 1) {
      btn.textContent = '☑ 比較する 2/2';
      btn.classList.add('active-2');
    } else {
      btn.textContent = '＋ 比較に追加';
      if (compareSlots[0] && compareSlots[1]) btn.classList.add('disabled');
    }
    const card = btn.closest('.card');
    if (card) card.classList.toggle('selected', slot !== -1);
  });
}

function compareColHtml(p, slotNum) {
  if (!p) {
    return `<div class="compare-col-empty">比較する${slotNum}/2<br>を選択してください</div>`;
  }
  const s = STATS[p.name];
  const other = compareSlots[slotNum === 1 ? 1 : 0];
  const otherS = other ? STATS[other.name] : null;
  let statsHtml = '<div class="no-stats" style="font-size:0.68rem;">データなし</div>';
  if (s) {
    statsHtml = s.map((v, i) => {
      const ov = otherS ? otherS[i] : null;
      const win = ov !== null && v > ov;
      return `
        <div class="compare-stat-row">
          <span class="compare-stat-label">${STAT_LABELS[i]}</span>
          <div class="compare-stat-bar-bg"><div class="compare-stat-bar-fill" style="width:${Math.min(100, v/STAT_MAX*100)}%"></div></div>
          <span class="compare-stat-value${win ? ' win' : ''}">${v}</span>
        </div>
      `;
    }).join('');
  }
  return `
    <div class="compare-head-row">
      <span class="compare-slot-badge slot${slotNum}">${slotNum}</span>
      <span class="compare-name">${escapeHtml(p.name)}</span>
      <button class="compare-remove" data-slot="${slotNum - 1}">✕</button>
    </div>
    ${typeBadgesHtml(p.name, 'compare-type-badge')}
    <div class="compare-meta">${p.cycle}周 / ${escapeHtml(p.nature)} / ${escapeHtml(p.evs)} / ${escapeHtml(p.item)}</div>
    <div class="compare-moves">${p.moves.map(m => moveButtonHtml(m, 'compare-move')).join('')}</div>
    ${statsHtml}
  `;
}

function renderCompareBar() {
  const anySelected = compareSlots[0] || compareSlots[1];
  compareBar.classList.toggle('show', !!anySelected);
  document.body.classList.toggle('has-compare', !!anySelected);
  if (!anySelected) {
    compareCols.innerHTML = '';
    return;
  }
  compareCols.innerHTML =
    `<div class="compare-col">${compareColHtml(compareSlots[0], 1)}</div>` +
    `<div class="compare-col">${compareColHtml(compareSlots[1], 2)}</div>`;
  compareCols.querySelectorAll('.compare-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const slot = Number(btn.dataset.slot);
      compareSlots[slot] = null;
      renderCompareBar();
      renderResultCompareButtons();
    });
  });
}

compareClearAll.addEventListener('click', () => {
  compareSlots = [null, null];
  renderCompareBar();
  renderResultCompareButtons();
});

function openAbilityModal(abilityName) {
  abilityModalName.textContent = abilityName;
  abilityModalBody.textContent = ABILITY_DESC[abilityName] || 'この特性の説明データが見つかりませんでした。';
  abilityModalOverlay.classList.add('show');
}
abilityModalClose.addEventListener('click', () => abilityModalOverlay.classList.remove('show'));
abilityModalOverlay.addEventListener('click', (e) => {
  if (e.target === abilityModalOverlay) abilityModalOverlay.classList.remove('show');
});

function render(query) {
  const q = query.trim();
  document.getElementById('visitorCounter').hidden = q.length > 0;
  results.innerHTML = '';

  clearBtn.classList.toggle('show', q.length > 0);

  if (!q) {
    countEl.textContent = '';
    emptyEl.style.display = 'none';
    return;
  }

  const matched = DATA.filter(p => {
    if (selectedCycle && p.cycle !== selectedCycle) return false;
    if (p.name.includes(q)) return true;
    return p.moves.some(m => m && m.includes(q));
  }).sort((a, b) => a.cycle - b.cycle || a.id - b.id);

  countEl.textContent = matched.length + ' 件';

  if (matched.length === 0) {
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const frag = document.createDocumentFragment();
  matched.slice(0, 300).forEach((p) => {
    const nameHit = p.name.includes(q);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-head clickable">
        <span class="cycle">${p.cycle}周</span>
        <span class="name${nameHit ? ' hit' : ''}">${escapeHtml(p.name)}</span>
        ${typeBadgesHtml(p.name, 'type-badge')}
        <span class="chevron">▼</span>
        <span class="meta">${escapeHtml(p.nature)} / ${escapeHtml(p.evs)} / ${escapeHtml(p.item)}</span>
      </div>
      <div class="card-actions">
        <button class="compare-btn" data-id="${p.id}">＋ 比較に追加</button>
        ${abilityChipsHtml(p.name)}
      </div>
      <div class="moves">
        ${p.moves.map(m => moveButtonHtml(m, 'move' + (m && m.includes(q) ? ' hit' : ''))).join('')}
      </div>
      <div class="stats-panel">${statsPanelHtml(p.name)}</div>
    `;
    const head = card.querySelector('.card-head');
    head.addEventListener('click', () => {
      card.classList.toggle('open');
    });
    const cbtn = card.querySelector('.compare-btn');
    cbtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleCompare(p);
    });
    card.querySelectorAll('.ability-chip').forEach(chip => {
      chip.addEventListener('click', (e) => {
        e.stopPropagation();
        openAbilityModal(chip.dataset.ability);
      });
    });
    frag.appendChild(card);
  });
  results.appendChild(frag);
  renderResultCompareButtons();
}

input.addEventListener('input', () => render(input.value));
clearBtn.addEventListener('click', () => {
  input.value = '';
  input.focus();
  render('');
});

render('');

/* ---------- type chart modal ---------- */

function buildTypeTable() {
  const types = TYPE_DATA.types;
  const eff = TYPE_DATA.eff;
  let html = '<table class="type-table"><thead><tr><th class="corner">攻\\防</th>';
  types.forEach(t => { html += `<th>${t}</th>`; });
  html += '</tr></thead><tbody>';
  types.forEach(atk => {
    html += `<tr><th>${atk}</th>`;
    types.forEach(def => {
      const v = (eff[atk] && eff[atk][def] !== undefined) ? eff[atk][def] : 1;
      let cls = '', sym = '';
      if (v === 2) { cls = 'eff2'; sym = '○'; }
      else if (v === 0.5) { cls = 'eff05'; sym = '△'; }
      else if (v === 0) { cls = 'eff0'; sym = '×'; }
      html += `<td class="${cls}">${sym}</td>`;
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

typeModalBody.innerHTML = buildTypeTable();

typeChartBtn.addEventListener('click', () => {
  typeModalOverlay.classList.add('show');
});
typeModalClose.addEventListener('click', () => {
  typeModalOverlay.classList.remove('show');
});
typeModalOverlay.addEventListener('click', (e) => {
  if (e.target === typeModalOverlay) typeModalOverlay.classList.remove('show');
});
/* ---------- shared visitor counter: page views, including repeat visits ---------- */
// page_pv is the remote total for this page, across all visitors, NOT a per-user counter.
// Keep this page's total separate from other repositories on itoen-poke.github.io.
// Canonicalize URL aliases before loading the service so query strings/index.html
// do not fragment the count. Search/filter operations never load the service again.
function normalizeVisitorCounterUrl() {
  if (location.hostname === 'itoen-poke.github.io' && /^\/batofaku(?:\/index\.html|\/)?$/.test(location.pathname)) {
    const canonical = '/batofaku/';
    if (location.pathname !== canonical || location.search || location.hash) {
      try { history.replaceState(history.state, '', canonical); } catch (_) { /* keep page usable */ }
    }
  }
}
function renderVisitorCount(rawValue) {
  const digits = document.getElementById('visitorDigits');
  const message = document.getElementById('kiribanMessage');
  const caption = document.getElementById('visitorCaption');
  const raw = String(rawValue).trim();
  message.hidden = true;
  if (!/^\d+$/.test(raw)) return false;
  const total = raw.replace(/^0+(?=\d)/, '');
  const display = total.padStart(6, '0');
  digits.replaceChildren(...[...display].map(number => {
    const digit = document.createElement('span');
    digit.textContent = number;
    return digit;
  }));
  digits.setAttribute('aria-label', 'あなたの足跡は ' + total + '番目');
  caption.textContent = 'あなたの足跡は';
  // Two or more identical non-zero digits, checked before display zero-padding.
  // No localStorage/cookies: congratulations are recomputed for this visit only.
  message.hidden = !/^([1-9])\1+$/.test(total);
  return true;
}
function setupVisitorCounter() {
  const caption = document.getElementById('visitorCaption');
  const value = document.getElementById('busuanzi_value_page_pv');
  const digits = document.getElementById('visitorDigits');
  const message = document.getElementById('kiribanMessage');
  caption.textContent = 'あなたの足跡は';
  message.hidden = true;
  if (!/^https?:$/.test(location.protocol)) {
    digits.setAttribute('aria-label', '公開後に足跡を集計');
    return;
  }
  normalizeVisitorCounterUrl();
  let received = false;
  const observer = new MutationObserver(() => {
    received = renderVisitorCount(value.textContent) || received;
  });
  observer.observe(value, { childList: true, subtree: true, characterData: true });
  function showCounterFailure() {
    if (received) return;
    message.hidden = true;
    digits.setAttribute('aria-label', '足跡を取得できませんでした');
    caption.textContent = 'あなたの足跡は（取得できません）';
  }
  const remote = document.createElement('script');
  remote.async = true;
  remote.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
  remote.onerror = showCounterFailure;
  document.head.appendChild(remote);
  setTimeout(showCounterFailure, 10000);
}
setupVisitorCounter();
/* ---------- end shared visitor counter ---------- */
